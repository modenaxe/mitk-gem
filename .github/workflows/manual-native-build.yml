name: Manual native build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: windows
        type: choice
        options:
          - windows
          - linux
          - macos
          - all
      build_type:
        description: CMake build configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - RelWithDebInfo
      upload_artifact:
        description: Upload the staged application files
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  QT_VERSION: 6.10.1
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  build:
    name: ${{ matrix.name }}
    if: ${{ inputs.platform == 'all' || inputs.platform == matrix.id }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # This configuration mirrors the validated local toolchain.
          - id: windows
            name: Windows (required)
            runner: windows-2022
            qt_arch: win64_msvc2022_64
            experimental: false
          # The POSIX builds exercise the same source stack, but remain
          # non-blocking until each platform has a successful baseline run.
          - id: linux
            name: Linux (experimental)
            runner: ubuntu-24.04
            qt_arch: linux_gcc_64
            experimental: true
          - id: macos
            name: macOS (experimental)
            runner: macos-15-intel
            qt_arch: clang_64
            experimental: true

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install CMake 4.3
        shell: bash
        run: python -m pip install --disable-pip-version-check cmake==4.3.0

      - name: Install Linux build dependencies
        if: matrix.id == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential ninja-build libcgal-dev libgmp-dev libmpfr-dev \
            libgl1-mesa-dev libglu1-mesa-dev libssl-dev
          cgal_config="$(dpkg -L libcgal-dev | grep '/CGALConfig.cmake$' | head -n 1)"
          echo "CGAL_DIR=$(dirname "$cgal_config")" >> "$GITHUB_ENV"
          echo "MITK_OPENSSL_ROOT_DIR=/usr" >> "$GITHUB_ENV"

      - name: Install macOS build dependencies
        if: matrix.id == 'macos'
        shell: bash
        run: |
          brew install cgal openssl@3 ninja
          echo "CGAL_DIR=$(brew --prefix cgal)/lib/cmake/CGAL" >> "$GITHUB_ENV"
          echo "MITK_OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Install Windows build dependencies
        if: matrix.id == 'windows'
        shell: pwsh
        run: |
          choco install openssl --yes --no-progress --limit-output
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkgRoot
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          & "$vcpkgRoot\vcpkg.exe" install cgal:x64-windows
          "CGAL_DIR=$vcpkgRoot\installed\x64-windows\share\cgal" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'MITK_OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL-Win64' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          modules: qtwebengine
          cache: true

      - name: Configure superbuild (Windows)
        if: matrix.id == 'windows'
        shell: pwsh
        run: |
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 `
            "-DQt6_DIR:PATH=$env:QT_ROOT_DIR\lib\cmake\Qt6" `
            "-DCGAL_DIR:PATH=$env:CGAL_DIR" `
            "-DMITK_OPENSSL_ROOT_DIR:PATH=$env:MITK_OPENSSL_ROOT_DIR" `
            '-DMITK-GEM_USE_SUPERBUILD:BOOL=ON' `
            '-DBUILD_TESTING:BOOL=OFF' `
            '-DMITK_BUILD_TESTING:BOOL=OFF' `
            '-DMITK_USE_Python3:BOOL=OFF'

      - name: Configure superbuild (Linux and macOS)
        if: matrix.id != 'windows'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ inputs.build_type }}" \
            -DQt6_DIR:PATH="$QT_ROOT_DIR/lib/cmake/Qt6" \
            -DCGAL_DIR:PATH="$CGAL_DIR" \
            -DMITK_OPENSSL_ROOT_DIR:PATH="$MITK_OPENSSL_ROOT_DIR" \
            -DMITK-GEM_USE_SUPERBUILD:BOOL=ON \
            -DBUILD_TESTING:BOOL=OFF \
            -DMITK_BUILD_TESTING:BOOL=OFF \
            -DMITK_USE_Python3:BOOL=OFF

      - name: Build and package MITK-GEM (Windows)
        if: matrix.id == 'windows'
        shell: pwsh
        run: cmake --build build --target MITK-GEM-package --config '${{ inputs.build_type }}' --parallel 2

      - name: Build and package MITK-GEM (Linux and macOS)
        if: matrix.id != 'windows'
        shell: bash
        run: cmake --build build --target MITK-GEM-package --config '${{ inputs.build_type }}' --parallel 2

      - name: Upload portable package
        if: ${{ success() && inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: MITK-GEM-${{ matrix.id }}-${{ inputs.build_type }}-portable
          if-no-files-found: error
          path: build/MITK-GEM-build/packages/*.zip
