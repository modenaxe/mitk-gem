name: Native build

on:
  push:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: windows
        type: choice
        options:
          - windows
          - linux
          - macos
          - all
      build_type:
        description: CMake build configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - RelWithDebInfo
      upload_artifact:
        description: Upload the staged application files
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  QT_VERSION: 6.10.1
  CMAKE_VERSION: 4.3.0
  MITK_VERSION: v2025.12.2
  # Pin the upstream commit that replaces the retired autoconf 2.71-3 MSYS2
  # archive used by GMP with the live 2.71-4 archive.
  VCPKG_COMMIT: 37bb045f3c7a747d3e5d1c13b6fe6a0aec4b5d00
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  select-platforms:
    name: Select build platforms
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      build_type: ${{ steps.select.outputs.build_type }}
      upload_artifact: ${{ steps.select.outputs.upload_artifact }}
    steps:
      - id: select
        name: Create selected build matrix
        shell: bash
        env:
          REQUESTED_PLATFORM: ${{ github.event.inputs.platform }}
          REQUESTED_BUILD_TYPE: ${{ github.event.inputs.build_type }}
          REQUESTED_UPLOAD_ARTIFACT: ${{ github.event.inputs.upload_artifact }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            REQUESTED_PLATFORM=windows
            REQUESTED_BUILD_TYPE=Release
            REQUESTED_UPLOAD_ARTIFACT=true
          fi

          : "${REQUESTED_PLATFORM:=windows}"
          : "${REQUESTED_BUILD_TYPE:=Release}"
          : "${REQUESTED_UPLOAD_ARTIFACT:=true}"
          echo "build_type=$REQUESTED_BUILD_TYPE" >> "$GITHUB_OUTPUT"
          echo "upload_artifact=$REQUESTED_UPLOAD_ARTIFACT" >> "$GITHUB_OUTPUT"

          case "$REQUESTED_PLATFORM" in
            windows)
              echo 'matrix={"include":[{"id":"windows","name":"Windows (required)","runner":"windows-2022","qt_arch":"win64_msvc2022_64","experimental":false}]}' >> "$GITHUB_OUTPUT"
              ;;
            linux)
              echo 'matrix={"include":[{"id":"linux","name":"Linux (experimental)","runner":"ubuntu-24.04","qt_arch":"linux_gcc_64","experimental":true}]}' >> "$GITHUB_OUTPUT"
              ;;
            macos)
              echo 'matrix={"include":[{"id":"macos","name":"macOS (experimental)","runner":"macos-15-intel","qt_arch":"clang_64","experimental":true}]}' >> "$GITHUB_OUTPUT"
              ;;
            all)
              echo 'matrix={"include":[{"id":"windows","name":"Windows (required)","runner":"windows-2022","qt_arch":"win64_msvc2022_64","experimental":false},{"id":"linux","name":"Linux (experimental)","runner":"ubuntu-24.04","qt_arch":"linux_gcc_64","experimental":true},{"id":"macos","name":"macOS (experimental)","runner":"macos-15-intel","qt_arch":"clang_64","experimental":true}]}' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported platform selection: $REQUESTED_PLATFORM" >&2
              exit 1
              ;;
          esac

  build:
    needs: select-platforms
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-platforms.outputs.matrix) }}
    env:
      BUILD_TYPE: ${{ needs.select-platforms.outputs.build_type }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Locate pip cache
        id: pip-cache
        shell: pwsh
        run: |
          $pipCacheDirectory = (python -m pip cache dir).Trim()
          "dir=$pipCacheDirectory" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore pip download cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ runner.os }}-pip-cmake-${{ env.CMAKE_VERSION }}

      - name: Install CMake
        shell: bash
        run: python -m pip install --disable-pip-version-check "cmake==$CMAKE_VERSION"

      - name: Install Linux build dependencies
        if: matrix.id == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential ninja-build libcgal-dev libgmp-dev libmpfr-dev \
            libgl1-mesa-dev libglu1-mesa-dev libssl-dev
          cgal_config="$(dpkg -L libcgal-dev | grep '/CGALConfig.cmake$' | head -n 1)"
          echo "CGAL_DIR=$(dirname "$cgal_config")" >> "$GITHUB_ENV"
          echo "MITK_OPENSSL_ROOT_DIR=/usr" >> "$GITHUB_ENV"

      - name: Install macOS build dependencies
        if: matrix.id == 'macos'
        shell: bash
        run: |
          brew install cgal openssl@3 ninja
          echo "CGAL_DIR=$(brew --prefix cgal)/lib/cmake/CGAL" >> "$GITHUB_ENV"
          echo "MITK_OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Prepare Windows build dependencies
        if: matrix.id == 'windows'
        shell: pwsh
        run: |
          choco install openssl --yes --no-progress --limit-output
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git init $vcpkgRoot
          git -C $vcpkgRoot remote add origin https://github.com/microsoft/vcpkg.git
          git -C $vcpkgRoot fetch --depth 1 origin $env:VCPKG_COMMIT
          git -C $vcpkgRoot checkout --detach FETCH_HEAD
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          $vcpkgBinaryCache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_BINARY_CACHE=$vcpkgBinaryCache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'MITK_OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL-Win64' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore vcpkg package cache
        if: matrix.id == 'windows'
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg/downloads
            ${{ runner.temp }}/vcpkg/installed
            ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ runner.os }}-vcpkg-${{ env.VCPKG_COMMIT }}-cgal-x64-windows-${{ hashFiles('CMake/PackageDepends/MITK_CGAL_Config.cmake', 'Modules/GemMesher/CMakeLists.txt') }}

      - name: Install CGAL (Windows)
        if: matrix.id == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:VCPKG_BINARY_CACHE -Force | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = $env:VCPKG_BINARY_CACHE
          & "$env:VCPKG_ROOT\vcpkg.exe" install cgal:x64-windows
          "CGAL_DIR=$env:VCPKG_ROOT\installed\x64-windows\share\cgal" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          modules: qt5compat qtwebchannel qtwebengine
          cache: true

      # Cache the pinned MITK source checkout, not generated build output.
      # The cache key changes with the source version and compatibility patch.
      - name: Restore MITK source cache
        id: mitk-source-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mitk-source
          key: ${{ runner.os }}-mitk-source-${{ env.MITK_VERSION }}-${{ hashFiles('CMakeExternals/MITK.cmake', 'CMake/ApplyMITK2025CMake4Compat.cmake', 'CMake/MITK-GEM-MITKInitialCache.cmake.in') }}

      - name: Restore MITK external source cache
        uses: actions/cache@v4
        with:
          path: build/MITK-superbuild/ep/src
          key: ${{ runner.os }}-mitk-external-sources-${{ env.MITK_VERSION }}-${{ hashFiles('CMakeExternals/MITK.cmake', 'CMake/ApplyMITK2025CMake4Compat.cmake', 'CMake/MITK-GEM-MITKInitialCache.cmake.in') }}

      - name: Prepare MITK source
        shell: pwsh
        env:
          MITK_SOURCE_CACHE_HIT: ${{ steps.mitk-source-cache.outputs.cache-hit }}
        run: |
          $mitkSourceDirectory = Join-Path $env:RUNNER_TEMP 'mitk-source'
          $mitkGitDirectory = Join-Path $mitkSourceDirectory '.git'
          if ($env:MITK_SOURCE_CACHE_HIT -eq 'true') {
            if (-not (Test-Path -LiteralPath $mitkGitDirectory)) {
              throw "Restored MITK source cache is not a Git checkout: $mitkSourceDirectory"
            }
          } else {
            git clone --depth 1 --branch $env:MITK_VERSION https://github.com/MITK/MITK.git $mitkSourceDirectory
          }
          "MITK_SOURCE_DIR=$mitkSourceDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure superbuild (Windows)
        if: matrix.id == 'windows'
        shell: pwsh
        run: |
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 `
            "-DQt6_DIR:PATH=$env:QT_ROOT_DIR\lib\cmake\Qt6" `
            "-DCGAL_DIR:PATH=$env:CGAL_DIR" `
            "-DMITK_SOURCE_DIR:PATH=$env:MITK_SOURCE_DIR" `
            "-DMITK_OPENSSL_ROOT_DIR:PATH=$env:MITK_OPENSSL_ROOT_DIR" `
            '-DMITK-GEM_USE_SUPERBUILD:BOOL=ON' `
            '-DBUILD_TESTING:BOOL=OFF' `
            '-DMITK_BUILD_TESTING:BOOL=OFF' `
            '-DMITK_USE_Python3:BOOL=OFF'

      - name: Configure superbuild (Linux and macOS)
        if: matrix.id != 'windows'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" \
            -DQt6_DIR:PATH="$QT_ROOT_DIR/lib/cmake/Qt6" \
            -DCGAL_DIR:PATH="$CGAL_DIR" \
            -DMITK_SOURCE_DIR:PATH="$MITK_SOURCE_DIR" \
            -DMITK_OPENSSL_ROOT_DIR:PATH="$MITK_OPENSSL_ROOT_DIR" \
            -DMITK-GEM_USE_SUPERBUILD:BOOL=ON \
            -DBUILD_TESTING:BOOL=OFF \
            -DMITK_BUILD_TESTING:BOOL=OFF \
            -DMITK_USE_Python3:BOOL=OFF

      - name: Build and package MITK-GEM (Windows)
        if: matrix.id == 'windows'
        shell: pwsh
        run: cmake --build build --target MITK-GEM-package --config '${{ env.BUILD_TYPE }}' --parallel 2

      - name: Build and package MITK-GEM (Linux and macOS)
        if: matrix.id != 'windows'
        shell: bash
        run: cmake --build build --target MITK-GEM-package --config '${{ env.BUILD_TYPE }}' --parallel 2

      - name: Upload portable package
        if: ${{ success() && needs.select-platforms.outputs.upload_artifact == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: MITK-GEM-${{ matrix.id }}-${{ env.BUILD_TYPE }}-portable
          if-no-files-found: error
          path: build/MITK-GEM-build/packages/*.zip
